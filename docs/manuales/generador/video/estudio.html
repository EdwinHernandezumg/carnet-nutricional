<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Estudio de grabación</title>
<style>
  :root { --marino: #14304a; --marino-osc: #0d2236; --teal: #1d9e75; --teal-claro: #9fdcc6; }
  /* Se diseña a 540 x 960 y se graba a 1080 x 1920: el zoom también le da al
     teléfono (el iframe) el doble de resolución, con el texto nítido. */
  html { zoom: 2; }
  html, body { margin: 0; width: 540px; height: 960px; overflow: hidden; }
  body { background: linear-gradient(180deg, var(--marino) 0%, var(--marino-osc) 100%); font-family: 'Segoe UI', Arial, sans-serif; color: #fff; position: relative; }
  #banda { position: absolute; top: 0; left: 0; right: 0; height: 82px; display: flex; align-items: center; padding: 0 28px; gap: 14px; }
  #banda .barra { width: 6px; height: 46px; border-radius: 3px; background: var(--teal); }
  #banda .marca { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--teal-claro); font-weight: 600; }
  #banda .titulo { font-size: 25px; font-weight: 700; line-height: 1.15; transition: opacity .35s; }
  #telefono { position: absolute; top: 86px; left: 72px; width: 375px; height: 680px; padding: 10px; border-radius: 40px;
    background: #050c14; box-shadow: 0 18px 40px rgba(0,0,0,.45), inset 0 0 0 2px #2a3a4c; }
  #telefono iframe { width: 375px; height: 680px; border: 0; border-radius: 30px; background: #f3f6fa; display: block; }
  #subtitulo { position: absolute; top: 790px; left: 26px; right: 26px; height: 150px; display: flex; align-items: center; justify-content: center;
    text-align: center; font-size: 21px; line-height: 1.38; font-weight: 500; transition: opacity .2s; }
  #portada { position: absolute; inset: 0; background: linear-gradient(180deg, var(--marino) 0%, var(--marino-osc) 100%); display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 0 40px; transition: opacity .6s; z-index: 5; }
  #portada.oculta { opacity: 0; pointer-events: none; }
  .emblema { width: 104px; height: 104px; border-radius: 50%; background: var(--teal); display: flex; align-items: center; justify-content: center; margin-bottom: 26px;
    box-shadow: 0 0 0 10px rgba(29,158,117,.18); }
  .nombre { font-size: 50px; font-weight: 800; letter-spacing: -.01em; }
  .nombre span { color: #4fd1a5; }
  .linea1 { font-size: 22px; margin-top: 14px; color: #dbe7f1; }
  .linea2 { font-size: 17px; margin-top: 34px; color: #9fb4c7; line-height: 1.5; }
  .aviso { margin-top: 40px; font-size: 16px; padding: 10px 18px; border-radius: 999px; background: rgba(255,255,255,.08); color: #ffe7a3; }
  #portada .subt { position: absolute; left: 26px; right: 26px; bottom: 28px; height: 130px; display: flex; align-items: center; justify-content: center; font-size: 21px; line-height: 1.38; }
</style>
</head>
<body>
  <div id="banda"><div class="barra"></div><div><div class="marca">Carnet Digital · Guía en video</div><div class="titulo" id="titulo"></div></div></div>
  <div id="telefono"><iframe id="app" src="about:blank"></iframe></div>
  <div id="subtitulo"></div>
  <div id="portada">
    <div class="emblema"><svg width="58" height="58" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M7 15l3.5-4 3 3L20 7"/><circle cx="20" cy="7" r="1.6"/></svg></div>
    <div class="nombre">Carnet <span>Digital</span></div>
    <div class="linea1" id="portada-linea1">Guía en video para el personal de enfermería</div>
    <div class="linea2" id="portada-linea2">Puesto de Salud de Chivarreto<br>San Francisco El Alto, Totonicapán</div>
    <div class="aviso" id="portada-aviso">Los datos de esta demostración no son reales</div>
    <div class="subt"></div>
  </div>
<script>
  // Funciones que llama el script de grabación.
  window.estudio = {
    titulo(texto) {
      const t = document.getElementById('titulo');
      t.style.opacity = 0;
      setTimeout(() => { t.textContent = texto; t.style.opacity = 1; }, 350);
    },
    subtitulo(texto) {
      for (const id of ['subtitulo']) {
        const s = document.getElementById(id);
        s.style.opacity = 0;
        setTimeout(() => { s.textContent = texto; s.style.opacity = 1; }, 200);
      }
      const p = document.querySelector('#portada .subt');
      if (p) p.textContent = texto;
    },
    portada(visible, linea1, linea2, aviso) {
      const p = document.getElementById('portada');
      if (linea1 !== undefined) document.getElementById('portada-linea1').innerHTML = linea1;
      if (linea2 !== undefined) document.getElementById('portada-linea2').innerHTML = linea2;
      if (aviso !== undefined) document.getElementById('portada-aviso').innerHTML = aviso;
      p.classList.toggle('oculta', !visible);
    },
  };
</script>
</body>
</html>
