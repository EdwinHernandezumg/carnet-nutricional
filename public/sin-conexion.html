<!DOCTYPE html>
<html lang="es">
<!-- Aviso que muestra la aplicación instalada cuando el teléfono no tiene
     internet (lo guarda y lo sirve public/sw.php). No lleva datos de nadie. -->
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#14304a">
    <title>Sin conexión · Carnet Digital</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               background: #f3f6fa; color: #2b3947; font-family: 'Segoe UI', Roboto, Arial, sans-serif; }
        .caja { max-width: 340px; margin: 24px; padding: 32px 24px; background: #fff; border-radius: 14px;
                border-top: 5px solid #1d9e75; text-align: center; box-shadow: 0 6px 20px rgba(20, 48, 74, .08); }
        h1 { font-size: 1.35rem; color: #14304a; margin: 16px 0 8px; }
        p { line-height: 1.5; margin: 0 0 22px; }
        button { font: inherit; font-weight: 600; color: #fff; background: #1d9e75; border: 0;
                 border-radius: 10px; padding: 12px 28px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="caja">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#1d9e75" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 8.5a15 15 0 0 1 20 0"/><path d="M5 12a10.5 10.5 0 0 1 14 0"/>
            <path d="M8.5 15.5a5.5 5.5 0 0 1 7 0"/><circle cx="12" cy="19" r="1"/><path d="M3 3l18 18"/>
        </svg>
        <h1>Sin conexión a internet</h1>
        <p>El Carnet Digital necesita internet para guardar y consultar los datos.
           Revise los datos móviles o el wifi y vuelva a intentar.</p>
        <button type="button" onclick="location.reload()">Volver a intentar</button>
    </div>
</body>
</html>
